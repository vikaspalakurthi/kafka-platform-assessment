---
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: these jobs only scan, so they need nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      # Actions are pinned to commit SHAs, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: v0.65.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact

  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install ansible-core==2.20.1 ansible-lint==26.1.1 yamllint==1.38.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: yamllint .
      - run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible
      - run: ansible-lint
        working-directory: ansible
      - run: ansible-playbook -i inventory/lab.yml rolling_config.yml --syntax-check
        working-directory: ansible

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: ruff check scripts
      - run: mypy --ignore-missing-imports scripts/lag_report.py
      - run: bandit -q scripts/lag_report.py
      - run: pip-audit -r scripts/requirements.txt
      - run: python -m pytest -q test_lag_report.py
        working-directory: scripts

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks needs the whole history, not just the last commit.
          persist-credentials: false
      - name: Secrets in git history
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact
      - name: Checkov
        run: >-
          docker run --rm -v "$PWD:/repo:ro" bridgecrew/checkov:3.4.3
          -d /repo --compact --quiet --framework terraform dockerfile ansible secrets github_actions
      - name: Trivy misconfiguration scan
        run: docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.76.1 config --exit-code 1 /repo
