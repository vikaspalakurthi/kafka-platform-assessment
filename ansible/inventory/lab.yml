---
# Local Docker lab only: plaintext listeners and no authentication.
kafka_brokers:
  hosts:
    kafka1:
      kafka_node_id: 1
    kafka2:
      kafka_node_id: 2
    kafka3:
      kafka_node_id: 3
  vars:
    ansible_connection: community.docker.docker
    ansible_python_interpreter: /usr/bin/python3

    # The containers run as appuser with no sudo, and the lab config has no secrets.
    kafka_become: false
    kafka_show_diff: true

    kafka_config_path: /etc/kafka/server.properties
    kafka_config_owner: appuser
    kafka_config_group: appuser
    kafka_bootstrap_servers: kafka1:9092,kafka2:9092,kafka3:9092

    # There is no systemd in the containers, so the host restarts them instead.
    # -t 60 gives the broker time for a controlled shutdown after SIGTERM.
    kafka_restart_command: docker restart -t 60 {{ inventory_hostname }}
    kafka_restart_on_controller: true

    kafka_urp_retries: 18
    kafka_urp_delay: 5

    kafka_properties:
      node.id: "{{ kafka_node_id }}"
      process.roles: broker,controller
      controller.quorum.voters: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      controller.listener.names: CONTROLLER
      listeners: PLAINTEXT://:9092,CONTROLLER://:9093
      advertised.listeners: PLAINTEXT://{{ inventory_hostname }}:9092
      listener.security.protocol.map: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      inter.broker.listener.name: PLAINTEXT
      log.dirs: /var/lib/kafka/data
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
